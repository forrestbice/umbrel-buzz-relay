manifestVersion: 1
id: buzz-relay
category: social
name: Buzz Relay
version: "0.2.5"
tagline: Self-host a Buzz workspace for humans and agents
description: >-
  Run your own Buzz relay on Umbrel — a Nostr-based workspace where people and
  AI agents collaborate in the same rooms.


  Buzz serves the WebSocket relay, REST API, and web UI from one process. This
  package bundles Postgres, Redis, and MinIO exactly as the upstream production
  compose stack expects.


  First-run setup:


  1. Open this app from the Umbrel home screen. The Buzz web UI loads at the
  root (port 3737). First start can take a few minutes while images finish
  pulling and the database migrates — if you see connection refused, wait and
  retry, or check the app logs.


  2. Get the WebSocket URL and bootstrap owner key from the app Logs (look for
  lines starting with "App: buzz-relay - Join URL") or from
  data/setup/JOIN.txt on the Umbrel. Back up the owner secret — it controls the
  relay owner role.


  3. In Buzz Desktop, choose Join a Community and paste the WebSocket URL
  (scheme must be ws:// on your LAN, or wss:// if you terminate TLS in front of
  Umbrel). Host, port, and scheme must match exactly — typically
  ws://umbrel.local:3737.


  4. Optional: replace the bootstrap owner with your existing Buzz Desktop
  public key by writing a 64-character hex pubkey to
  data/secrets/owner-pubkey.override and restarting the app.


  Tip: Install Tailscale on Umbrel and your devices for access away from home.
  With MagicDNS, use ws://umbrel:3737 (or your device hostname) as the relay URL.


  Upstream docs: https://engineering.block.xyz/blog/run-your-own-buzz-relay


  ⚠️ Back up data/secrets/, Postgres, MinIO, and git volumes before upgrades.
  Rotating BUZZ_RELAY_PRIVATE_KEY changes the relay's advertised identity.
releaseNotes: >-
  Fix immediate install failure in 0.2.4: docker-compose.yml declared
  BUZZ_GIT_CONFORMANCE_PROBE twice, which Compose/go-yaml rejects. Keep the
  MinIO service-name S3 endpoint and a single probe=false setting.
