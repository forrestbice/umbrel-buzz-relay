id: buzz-relay
category: social
name: Buzz Relay
version: "0.2.9"
tagline: Self-host a Buzz workspace for humans and agents
description: >-
  Run your own Buzz relay on Umbrel — a Nostr-based workspace where people and
  AI agents collaborate in the same rooms.


  Buzz serves the WebSocket relay, REST API, and web UI from one process. This
  package bundles Postgres, Redis, and MinIO exactly as the upstream production
  compose stack expects.


  First-run setup:


  1. Open this app (port 3737). You should land on /umbrel-setup/. First start
  can take a minute or two while images pull and the database migrates. If you
  see the empty “This relay is empty” page, use the banner or open /umbrel-setup/.


  2. On /umbrel-setup/, paste your Buzz Desktop public key (Settings → Identity
  → 64-char hex, or npub1…) and click Save owner pubkey. This is the same idea as
  RELAY_OWNER_PUBKEY in the upstream self-host guide — your existing Desktop
  identity becomes the relay owner. Then restart Buzz Relay in Umbrel.


  3. In Buzz Desktop, choose Join a Community (not “Open in Buzz”) and paste the
  WebSocket URL from the setup page. Scheme, host, and port must match —
  typically ws://umbrel.local:3737. Use ws:// on a pure LAN, not wss://.


  4. “You need an invite” from Open in Buzz is expected until you have joined as
  owner. The empty web UI cannot mint the first membership.


  Tip: Install Tailscale on Umbrel and your devices for access away from home.
  With MagicDNS, use ws://umbrel:3737 (or your device hostname) as the relay URL.


  Upstream docs: https://engineering.block.xyz/blog/run-your-own-buzz-relay


  ⚠️ Back up data/secrets/, Postgres, MinIO, and git volumes before upgrades.
  Rotating BUZZ_RELAY_PRIVATE_KEY changes the relay's advertised identity.
releaseNotes: >-
  Editable /umbrel-setup/: paste your Buzz Desktop hex pubkey or npub to set the
  relay owner (RELAY_OWNER_PUBKEY / owner-pubkey.override), then restart. No SSH
  required to use an existing Desktop identity.
