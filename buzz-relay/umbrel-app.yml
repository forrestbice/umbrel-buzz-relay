manifestVersion: 1
id: buzz-relay
category: social
name: Buzz Relay
version: "0.2.7"
tagline: Self-host a Buzz workspace for humans and agents
description: >-
  Run your own Buzz relay on Umbrel — a Nostr-based workspace where people and
  AI agents collaborate in the same rooms.


  Buzz serves the WebSocket relay, REST API, and web UI from one process. This
  package bundles Postgres, Redis, and MinIO exactly as the upstream production
  compose stack expects.


  First-run setup:


  1. Open this app (port 3737). You land on /umbrel-setup/ with the WebSocket
  Join URL and bootstrap owner secret — back that secret up. First start can
  take a minute or two while images pull and the database migrates.


  2. In Buzz Desktop, choose Join a Community (not “Open in Buzz” from the empty
  web UI) and paste the WebSocket URL exactly. Scheme, host, and port must match
  — typically ws://umbrel.local:3737. Use ws:// on a pure LAN, not wss://.


  3. This is a closed membership relay. Your Desktop identity must be the relay
  owner (or an invited member). Easiest: write your Desktop hex public key to
  data/secrets/owner-pubkey.override, restart the app, then Join a Community
  with that same Desktop identity. Or import the bootstrap owner secret shown
  on the setup page.


  4. The Buzz web UI at / may show “auth-required” toasts until you are joined
  as a member — that is expected for the empty public view.


  Tip: Install Tailscale on Umbrel and your devices for access away from home.
  With MagicDNS, use ws://umbrel:3737 (or your device hostname) as the relay URL.


  Upstream docs: https://engineering.block.xyz/blog/run-your-own-buzz-relay


  ⚠️ Back up data/secrets/, Postgres, MinIO, and git volumes before upgrades.
  Rotating BUZZ_RELAY_PRIVATE_KEY changes the relay's advertised identity.
releaseNotes: >-
  Fix `/` returning "no community is configured for this host" after 0.2.6.
  Nginx now forwards the full Host header (including port) so Buzz can match
  the community bound to umbrel.local:3737. `/umbrel-setup/` unchanged.
