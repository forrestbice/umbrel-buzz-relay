version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: buzz-relay_proxy_1
      APP_PORT: 8080
      # Buzz Desktop and other Nostr clients cannot present Umbrel session cookies.
      PROXY_AUTH_ADD: "false"

  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/setup:/usr/share/nginx/html/umbrel-setup:ro
      - ${APP_DATA_DIR}/data/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  web:
    image: ghcr.io/block/buzz:0.2.0@sha256:a0f67203d71d15d237fa7517788799957c30c8acdb81cbcff711e07e951c2710
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/git:/data/git
    env_file:
      - ${APP_DATA_DIR}/data/secrets/relay.env
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      BUZZ_DOMAIN: ${APP_BUZZ_RELAY_DOMAIN}
      RELAY_URL: ${APP_BUZZ_RELAY_WS_URL}
      BUZZ_MEDIA_BASE_URL: ${APP_BUZZ_RELAY_HTTP_ORIGIN}/media
      BUZZ_MEDIA_SERVER_DOMAIN: ${APP_BUZZ_RELAY_DOMAIN}
      BUZZ_CORS_ORIGINS: ${APP_BUZZ_RELAY_HTTP_ORIGIN}
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "true"
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${APP_BUZZ_RELAY_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${APP_BUZZ_RELAY_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_HOOK_HMAC_SECRET: ${APP_BUZZ_RELAY_GIT_HOOK_HMAC_SECRET}
      DATABASE_URL: postgres://buzz:${APP_BUZZ_RELAY_POSTGRES_PASSWORD}@postgres:5432/buzz
      REDIS_URL: redis://:${APP_BUZZ_RELAY_REDIS_PASSWORD}@redis:6379
      RUST_LOG: buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${APP_BUZZ_RELAY_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: on-failure
    user: "1000:1000"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${APP_BUZZ_RELAY_REDIS_PASSWORD}",
      ]
    environment:
      REDIS_PASSWORD: ${APP_BUZZ_RELAY_REDIS_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: on-failure
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${APP_BUZZ_RELAY_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${APP_BUZZ_RELAY_S3_SECRET_KEY}
    volumes:
      - ${APP_DATA_DIR}/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: ${APP_BUZZ_RELAY_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${APP_BUZZ_RELAY_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: buzz-media
    entrypoint:
      - /bin/sh
      - -euc
      - |
        mc alias set local http://minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
    restart: "no"
